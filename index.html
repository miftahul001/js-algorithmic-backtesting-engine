<!DOCTYPE html><html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtesting Engine</title>
<link href="favicon.svg" rel="icon" sizes="any" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<link href="js/codemirror/codemirror.css" rel="stylesheet">

<script src="https://miftahul001.github.io/m/m.js"></script>
<script src="js/codemirror/codemirror.js"></script>
<script src="js/codemirror/javascript.js"></script>
<script src="js/script.js"></script>

<style>
* {
	box-sizing: border-box;
}
iframe {
	border: none;
	flex: 1 1 auto;
	margin: 0;
	padding: 0;
}
.CodeMirror { height: auto; flex: 1 1 auto; }

.pop1 {
	background: rgba(255, 255, 255, 0.9);
	border-radius: 9px;
	box-shadow: rgba(0, 0, 0, 0.1) 0px 0px 11px 3px;
	display: flex;
	flex-direction: column;
	gap: 7px;
	margin: 0;
	position: fixed;
	padding: 7px 11px 11px;
}
.pop1 > div:nth-child(1) {
	align-items: center;
	background:rgba(233,237,237,0.9);
	border-radius:7px;
	box-shadow: inset 5px 5px 15px rgba(191,201,203,0.9), inset -5px -5px 15px rgba(191,201,203,0.9);
	cursor: grab;
	display: flex;
	padding: 3px 15px;
}
.pop1 > div:nth-child(1) > div {
	color:rgba(17,123,101,0.9);
	font-size: 17px;
	font-weight: bold;
	text-shadow: 0 0 1px #154359;
}
.pop1 > div:nth-child(1) > div:nth-child(1), .pop1 > div:nth-child(1) > div:nth-child(3) {
	cursor: default;
}
.pop1 > div:nth-child(1) > div:nth-child(2) {
	flex: 1 1 auto;
	padding: 9px 33px;
	text-align: center;
}
.pop1 > div:nth-child(2) {
	background: rgba(255,255,255,0.7);
	display: flex;
	flex-direction: column;
}
.pop1 > div:nth-child(2).hide { display: none; }
.pop1 > div:nth-child(2) > div:nth-child(1) {
	display: flex;
	align-items: flex-end;
	padding: 5px;
}
.pop1 > div:nth-child(2) > div:nth-child(1) > div:nth-child(1) {
	cursor: pointer;
	font-size: 27px;
	margin: 0 11px;
}
.pop1 > div:nth-child(2) > div:nth-child(1) > div:nth-child(2) { flex: 1 1 auto; }
.pop1 > div:nth-child(2) > div:nth-child(1) > div:last-child {
	border-radius: 5px;
	box-shadow: inset 3px 3px 11px rgba(191,201,203,0.9), inset -3px -3px 11px rgba(191,201,203,0.9);
	cursor: default;
	font-size: 13px;
	font-weight: bold;
	padding: 3px 11px;
}
.pop1 > div:nth-child(2) > div:nth-child(1) > div:hover {
	background: rgba(233,237,239,0.7);
}
.pop1 > div:nth-child(2) > div:nth-child(2) {
	border: 1px solid #c0c0c0;
	border-radius: 5px;
	min-height: 200px;
	min-width: 300px;
	max-height: 80vh;
	max-width: 90vw;
	overflow: scroll;
	padding: 5px;
	resize: both;
}
</style>

</head><body>

<div>
	<p style="text-align:center; font-size:29px;"><strong>Backtesting Engine</strong></p>
	<div style="padding:13px 33px;">
		<button onclick="newEngine()">New</button>
	</div>
</div>

</body>
</html>
